<script>
    if (opener) {
        try {
            if (opener.location.origin === location.origin) {
                const search = new URLSearchParams(location.search);
                const message = {soundcloud_callback: true};
                for (const [key, value] of search.entries()) {
                    message[key] = value;
                }
                opener.postMessage(message, location.origin);
            }
        } catch {
            try {
                const search = new URLSearchParams(location.search);
                const state = search.get('state');
                const params = new URLSearchParams(`?${state}`);
                const origin = params.get('o');
                if (['https://ampcast.app', 'https://ampcast.dev', 'ampcast:/'].includes(origin)) {
                    location.href = `${origin}${location.pathname}${location.search}`;
                } else {
                    window.close();
                }
            } catch {
                window.close();
            }
        }
    }
</script>
